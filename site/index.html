      <div class="verify-training-row">

      <div class="verify-training-row gold">

        <div class="verify-training-copy">支持、反对或待确认<br /><b>写出结论</b></div>

      </div>
    </div>
  </div>

</div>

    <script>
      function extend() {
        var target = {};
        for (var i = 0; i < arguments.length; i++) {
          var source = arguments[i];
          for (var key in source) {
            if (source.hasOwnProperty(key)) {
              target[key] = source[key];
            }
          }
        }
        return target;
      }

      var defaultOptions = {
        controls: true,
        progress: true,
        history: true,
        center: true,
        transition: 'default',
        slideNumber: true,
        plugins: [
          RevealMarkdown,
          RevealHighlight,
          RevealZoom,
          RevealNotes,
          RevealMath.KaTeX
        ]
      };

      var queryOptions = Reveal().getQueryHash() || {};
      var options = extend(defaultOptions, {"transition":"slide","transitionSpeed":"fast","center":false,"slideNumber":"c/t","width":1200,"_":["main.md"],"scripts":"https://cdn.tonycrane.cc/heti/heti.js,heti_worker.js","template":"template.html","static":"site","assets-dir":"assets","assetsDir":"assets"}, queryOptions);
    </script>

    <script src="https://cdn.tonycrane.cc/heti/heti.js"></script>
    <script src="./assets/heti_worker.js"></script>

    <script>
      Reveal.initialize(options).then(() => {
        const backgrounds = document.querySelector('.backgrounds');
        const slides = document.querySelector('.slides');
        if (backgrounds && slides) {
          backgrounds.setAttribute('style', slides.style.cssText);
        }
      });
      Reveal.on('overviewshown', () => {
        const backgrounds = document.querySelector('.backgrounds');
        if (backgrounds) backgrounds.setAttribute('style', '');
      });
      Reveal.on('overviewhidden', () => {
        const backgrounds = document.querySelector('.backgrounds');
        const slides = document.querySelector('.slides');
        if (backgrounds && slides) {
          backgrounds.setAttribute('style', slides.style.cssText);
        }
      });
      Reveal.on('resize', () => {
        const backgrounds = document.querySelector('.backgrounds');
        const slides = document.querySelector('.slides');
        if (backgrounds && slides) {
          backgrounds.setAttribute('style', slides.style.cssText);
        }
      });
    </script>
